{% extends "base.html" %}
{% block title %}Новый рецепт{% endblock %}
{% block content %}
<h1>Создание рецепта</h1>

<form method="post">
    <p>
        <input type="text" name="title" placeholder="Название" required>
    </p>
    <p>
        <textarea name="description" placeholder="Описание" required></textarea>
    </p>
    <p>
        <textarea name="steps" rows="8"
                  placeholder="Шаги приготовления (каждый шаг с новой строки)" required></textarea>
    </p>
    <p>
        <input type="text" name="ingredients"
               placeholder="Ингредиенты через запятую: Мука, Сахар, Лавровый лист">
    </p>
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
